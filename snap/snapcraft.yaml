name: test_flutter
version: 1.0.0
summary: Generated by Icons Launcher
description: Generated by Icons Launcher package for Linux.

confinement: strict
base: core22
grade: stable

slots:
  dbus-test_flutter: # adjust accordingly to your app name
    interface: dbus
    bus: session
    name: org.bar.test_flutter # adjust accordingly to your app name

apps:
  test_flutter:
    command: test_flutter
    extensions: [gnome] # gnome includes the libraries required by flutter
    plugs:
    - network
    slots:
      - dbus-test_flutter
parts:
  test_flutter:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart # The main entry-point file of the application
